<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <g transform="translate(400,250)" text-anchor="middle">
    <text font-family="Georgia, serif" font-size="56" font-weight="900" fill="rgba(255,255,255,0.95)">ZEN-G<tspan fill="#2563EB">.</tspan>NEWS</text>
    <text y="40" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="3">YOUR WORLD. YOUR NEWS. INSTANTLY.</text>
